baseURL: "https://baslevering.com/"
locale: "en-us"
title: "Bas Levering"
theme: "PaperMod"
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
pagination:
  pagerSize: 10

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: "Bas Levering"
  description: "Security research, Keycloak, healthcare IT. Netherlands."
  author: "Bas Levering"
  defaultTheme: "dark"
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  ShowToc: true
  TocOpen: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  homeInfoParams:
    Title: "Bas Levering"
    Content: >
      Security researcher & sysadmin · Netherlands · healthcare IT.

      Disclosed CVEs in identity / auth stacks. Building public research notes here.

  socialIcons:
    - name: github
      url: "https://github.com/Bazskillz/"
    - name: rss
      url: "/index.xml"
    - name: email
      url: "mailto:contact@baslevering.com"

  assets:
    disableHLJS: true
    disableFingerprinting: false
    favicon: "/favicon.ico"

  label:
    text: "baslevering.com"

menu:
  main:
    - identifier: writing
      name: writing
      url: /posts/
      weight: 10
    - identifier: research
      name: research
      url: /research/
      weight: 20
    - identifier: about
      name: about
      url: /about/
      weight: 30

markup:
  highlight:
    style: github-dark
    lineNos: true
    codeFences: true
    guessSyntax: true
    noClasses: false
  goldmark:
    renderer:
      unsafe: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  category: categories
  tag: tags
